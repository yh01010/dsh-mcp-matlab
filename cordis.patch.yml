# dsh-mcp-matlab bundle patch: inserts the MATLAB MCP client bridge into a profile's layer stack.
#
# Install into a profile (either command works; then restart dsh web):
#
#   dsh plugin --profile <name> add github:yh01010/dsh-mcp-matlab
#   dsh --profile <name> plugin add github:yh01010/dsh-mcp-matlab
#
# or list the package in the profile's `dsh.profile.bundles` and `pnpm install`.
#
# Backed by the host package `@deepseek-ai/dsh-mcp-client` (already shipped with
# dsh): one instance connects to one MCP server and registers its tools on
# `ctx.tools` under `mcp__<serverName>__<rawName>`.
#
# ⚠️ INSTALLING THIS PACKAGE DOES NOT GIVE YOU WORKING MATLAB TOOLS.
# This package carries no personal machine paths, so `command`/`args` below are
# placeholders. Until you replace them, the bridge cannot spawn the server and
# no `mcp__matlab__*` tool is registered. See "安装后还需要三步" in README.md.
#
# Recommended: override this row BY ID from `$DSH_HOME/cordis.patch.yml` — a
# non-insert entry with the same id, carrying only your real `config`. Never
# edit this file in an installed package (reinstalls overwrite it).
#
# ⚠️ Do NOT `insert` a second `mcp-matlab` row from the home patch while this
# bundle is installed. Two rows sharing one id mean two mcp-client instances on
# serverName `matlab`, and the second one aborts startup with
# `serverName "matlab" is already in use by another mcp-client instance`.
# Pick one wiring: bundled row + id override, or no bundle + home insert.
#
# Config reference (all per stdio transport):
#   serverName:           tool-name namespace, must be unique per profile
#   command:              MCP server executable (replace the placeholder!)
#   args:                 CLI arguments for the server
#   env:                  extra environment for the server process
#   cwd:                  working directory (default "")
#   toolCallTimeoutMs:    per-tool-call timeout, ms. MATLAB cold start +
#                         toolbox load can exceed the 60s default, so we raise
#                         it here (default 60000).
#   failOnStartupError:   throw if the initial connection fails (default false).
#                         Keep it false here on purpose: with the placeholder
#                         path above, true would abort EVERY dsh boot until the
#                         user fills in real paths — the plugin would be
#                         uninstallable. Enable it only after you verified your
#                         own command/matlab-root.
#   reconnect:            { enabled, initialDelayMs, maxDelayMs, maxAttempts }
- insert:
    - id: mcp-matlab
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: matlab
        transport: stdio
        command: 'C:\path\to\your\matlab-mcp-server-windows-x64.exe'
        args:
          - '--matlab-root=D:\path\to\your\matlab'
          - '--matlab-display-mode=nodesktop'
          - '--disable-telemetry'
        toolCallTimeoutMs: 120000
        failOnStartupError: false
